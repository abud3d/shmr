<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<meta name="description" content="SHMR — تجربة استثنائية قادمة. ترقبوا الإطلاق قريباً.">
<title>SHMR | قريباً</title>
<style>
:root{color-scheme:dark;--gold:#d8b66c;--muted:#aaa;--bg:#090909}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#322713 0%,#15120e 36%,#090909 78%);color:#f5f0e7;font-family:Tahoma,Arial,sans-serif}
body:before{content:"";position:fixed;inset:15px;border:1px solid #cba75a24;pointer-events:none}
.wrap{width:min(100% - 40px,1000px);margin:auto;min-height:100svh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:36px 0;border-bottom:1px solid #cba75a30;gap:12px}
.brand{color:var(--gold);font-size:24px;letter-spacing:.22em;font-weight:700;direction:ltr}
.tag{font-size:12px;color:#c9b88f;letter-spacing:.12em}nav{display:flex;gap:16px;flex-wrap:wrap}nav a{color:#e5d4ab;text-decoration:none;font-size:14px;padding:8px;border-bottom:1px solid transparent}nav a:hover,nav a:focus-visible{border-color:var(--gold)}@keyframes shimmer{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.12;transform:translateY(-9px)}}h1{animation:shimmer 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){h1{animation:none}}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:65px 0}
.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.35em;direction:ltr;margin-bottom:25px}
h1{font-size:clamp(75px,16vw,175px);line-height:1;margin:0;letter-spacing:.13em;padding-left:.13em;direction:ltr;background:linear-gradient(120deg,#86662c,#f5df9c 40%,#c39a4e 70%,#f2d68a);color:transparent;background-clip:text;-webkit-background-clip:text}
.rule{height:1px;width:105px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:36px auto}
h2{font-size:clamp(30px,6vw,54px);font-weight:400;margin:0 0 18px}
p{font-size:clamp(14px,2.2vw,18px);line-height:2.1;color:#b9b3a7;margin:0 0 38px}
.panel{border:1px solid #cba75a45;background:#ffffff05;border-radius:14px;padding:26px 40px;min-width:min(100%,440px);box-shadow:0 15px 60px #0005}
.clock{font:300 clamp(48px,10vw,84px)/1.2 Arial,sans-serif;letter-spacing:.05em;color:#f3dfaa;direction:ltr;font-variant-numeric:tabular-nums}
.date{color:#c6bda9;margin-top:12px;font-size:15px}
.zone{font-size:11px;color:#a88e58;margin-top:12px;letter-spacing:.12em}
footer{border-top:1px solid #cba75a30;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:25px 0 35px;font-size:12px;color:#9d8a64}
@media(max-width:500px){header{padding:25px 0}.panel{padding:24px 14px}footer{justify-content:center;text-align:center}}
</style>
</head>
<body><div class="wrap">
<header><div class="brand">SHMR</div><nav aria-label="القائمة الرئيسية"><a href="./">الرئيسية</a><a href="./services.html">خدماتنا</a><a href="./works.html">أعمالنا</a><a href="./features.html">مميزاتنا</a></nav></header>
<main>
<div class="eyebrow">A NEW ERA IS COMING</div>
<h1>SHMR</h1><div class="rule"></div>
<h2>قريباً</h2>
<p>نصنع شيئاً يستحق الانتظار.<br>رؤية جديدة، ومعايير أعلى، وتجربة تليق بتطلعاتكم.</p>
<section class="panel" aria-label="الوقت والتاريخ في الرياض">
<div class="clock" id="clock">--:--:--</div>
<div class="date" id="date">جاري تحديث التاريخ...</div>
<div class="zone">RIYADH · UTC+03:00</div>
</section>
</main>
<footer><span>© <span id="year">2026</span> SHMR. جميع الحقوق محفوظة.</span><span>COMING SOON · V2.1</span></footer>
</div>
<script>
(function(){
const zone="Asia/Riyadh";
function update(){
const now=new Date();
document.getElementById("clock").textContent=new Intl.DateTimeFormat("en-GB",{timeZone:zone,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(now);
document.getElementById("date").textContent=new Intl.DateTimeFormat("ar-SA-u-ca-gregory",{timeZone:zone,weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(now);
document.getElementById("year").textContent=new Intl.DateTimeFormat("en-US",{timeZone:zone,year:"numeric"}).format(now);
}
update();setInterval(update,1000);
})();
</script>
</body></html>
