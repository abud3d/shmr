<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>SHMR | لعبة الثعبان</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#332713,#090909 70%);color:#eee;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(100% - 32px,1000px);margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;border-bottom:1px solid #d8b66c55;padding:22px 0}header b{color:#d8b66c;font-size:25px;letter-spacing:3px}nav{display:flex;flex-wrap:wrap;gap:14px}a{color:#e5d4ab;text-decoration:none}main{text-align:center;padding:24px 0}h1{color:#e4c580;margin:10px}p{color:#bfb5a3}canvas{display:block;width:min(100%,400px);height:auto;aspect-ratio:1;margin:15px auto;background:#111;border:2px solid #d8b66c;border-radius:8px;touch-action:none}.info{display:flex;justify-content:center;gap:25px;color:#e4c580}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:1px solid #d8b66c;background:#201a11;color:#f5dfaa;padding:12px 20px;border-radius:9px;font:inherit;cursor:pointer;min-width:55px;min-height:46px}.pad{display:grid;grid-template-columns:repeat(3,60px);justify-content:center;gap:5px;margin:15px auto}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}footer{padding:22px;border-top:1px solid #d8b66c44;text-align:center;color:#bba16c;font-size:12px}@media(max-width:450px){nav{gap:10px;font-size:13px}}</style></head><body><div class="wrap"><header><b>SHMR</b><nav><a href="./">الرئيسية</a><a href="./services.html">خدماتنا</a><a href="./works.html">أعمالنا</a><a href="./features.html">مميزاتنا</a><a href="./snake.html">الألعاب</a><a href="./contact.html">اتصل بنا</a></nav></header><main><h1>🐍 لعبة الثعبان</h1><p>اجمع النقاط وتجنب الجدران وذيل الثعبان</p><div class="info"><strong>النقاط: <span id="score">0</span></strong><strong>الأفضل: <span id="best">0</span></strong></div><canvas id="board" width="400" height="400" aria-label="لوحة لعبة الثعبان"></canvas><div class="buttons"><button id="start">ابدأ / إعادة</button><button id="pause">إيقاف مؤقت</button></div><div class="pad"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><p id="status" aria-live="polite">اضغط ابدأ للعب. الأسهم ولوحة اللمس مدعومة.</p></main><footer>SHMR © 2026</footer></div><script>(function(){const c=document.getElementById("board"),ctx=c.getContext("2d"),n=20,cell=20;let snake,food,dir,next,score=0,best=0,timer=null,paused=false;try{best=Number(localStorage.getItem("shmr-snake-best"))||0}catch(e){}document.getElementById("best").textContent=best;function draw(){ctx.fillStyle="#111";ctx.fillRect(0,0,400,400);ctx.strokeStyle="#242017";for(let i=0;i<=20;i++){ctx.beginPath();ctx.moveTo(i*20,0);ctx.lineTo(i*20,400);ctx.moveTo(0,i*20);ctx.lineTo(400,i*20);ctx.stroke()}if(food){ctx.fillStyle="#e7b94f";ctx.beginPath();ctx.arc(food.x*20+10,food.y*20+10,8,0,Math.PI*2);ctx.fill()}if(snake)snake.forEach((s,i)=>{ctx.fillStyle=i===0?"#f3d98a":"#9b7b38";ctx.fillRect(s.x*20+2,s.y*20+2,16,16)})}function spawn(){let free=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!snake.some(s=>s.x===x&&s.y===y))free.push({x,y});return free.length?free[Math.floor(Math.random()*free.length)]:null}function stop(msg){clearInterval(timer);timer=null;document.getElementById("status").textContent=msg}function tick(){dir=next;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eat=food&&head.x===food.x&&head.y===food.y;const body=eat?snake:snake.slice(0,-1);if(head.x<0||head.y<0||head.x>=n||head.y>=n||body.some(s=>s.x===head.x&&s.y===head.y)){stop("انتهت اللعبة! اضغط ابدأ للمحاولة مجدداً.");return}snake.unshift(head);if(eat){score+=10;document.getElementById("score").textContent=score;if(score>best){best=score;document.getElementById("best").textContent=best;try{localStorage.setItem("shmr-snake-best",best)}catch(e){}}food=spawn();if(!food){draw();stop("مبروك! فزت باللعبة.");return}}else snake.pop();draw()}function start(){clearInterval(timer);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;score=0;paused=false;food=spawn();document.getElementById("score").textContent=0;document.getElementById("pause").textContent="إيقاف مؤقت";document.getElementById("status").textContent="العب الآن!";draw();timer=setInterval(tick,125)}function change(d){if(!snake||!timer||paused)return;const v={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];if(v&&!(v.x===-dir.x&&v.y===-dir.y))next=v}document.getElementById("start").addEventListener("click",start);document.getElementById("pause").addEventListener("click",function(){if(!snake)return;if(paused){paused=false;timer=setInterval(tick,125);this.textContent="إيقاف مؤقت";document.getElementById("status").textContent="استمر!"}else if(timer){clearInterval(timer);timer=null;paused=true;this.textContent="استئناف";document.getElementById("status").textContent="متوقفة مؤقتاً"}});document.querySelectorAll("[data-dir]").forEach(b=>b.addEventListener("click",()=>change(b.dataset.dir)));document.addEventListener("keydown",e=>{const map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};if(map[e.key]){e.preventDefault();change(map[e.key])}});let sx=0,sy=0;c.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});c.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>20)change(Math.abs(dx)>Math.abs(dy)?dx>0?"right":"left":dy>0?"down":"up")},{passive:true});draw()})();</script></body></html>
